<footer id="contact" class="footer">

    <div class="contact-section">
            <div class="kontakt-text">
            <h3 class="kontakt-title">Kontakt</h3>
            </div>

             <div class="kontakt-textinfo">
            <p>Hast du ein Feedback zu einem Spiel oder eine Anfrage auf eine grössere Bestellung oder Sonstiges? </p>
              <p> <br> Wir freuen uns auf deine Nachricht!</p>
        </div>

        <form id="contact-form">
    <input
        type="text"
        name="name"
        placeholder="*Name, Vorname"
        required
    >

    <input
        type="text"
        name="company"
        placeholder="Unternehmen, Firma"
    >

    <input
        type="email"
        name="email"
        placeholder="*E-Mail Adresse"
        required
    >

    <input
        type="tel"
        name="phone"
        placeholder="Telefonnummer"
    >

    <textarea
        name="message"
        placeholder="*Nachricht"
        required
    ></textarea>

    <button type="submit" class="btn">
        <img src="assets/Mail.png" class="mail-icon"> Senden
    </button>

    <p id="form-status"></p>
</form>
