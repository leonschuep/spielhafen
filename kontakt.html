<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Spielhafen – selbst entwickelte und gestaltete Kartenspiele aus der Schweiz. Entdecke Speed Up und unser kommendes Kartenspiel SumSum.">
  <title>Kontakt | Spielhafen</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="js/inhalte.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body >
  <a class="skip-link" href="#inhalt">Zum Inhalt</a>
  <header id="seitenkopf"></header>
  <main id="inhalt">
  <section class="page-intro wrap"><h1>Kontakt</h1><p>Feedback, Fragen zu einem Spiel oder Interesse an einer grösseren Bestellung?<br>Wir freuen uns auf deine Nachricht.</p></section>
  <section class="contact-layout wrap section"><aside><a class="text-link" href="mailto:ahoi@spielhafen.ch">ahoi@spielhafen.ch ↗</a></aside>
  <form id="contact-form"><div class="form-grid"><label>Name, Vorname *<input name="name" autocomplete="name" required maxlength="150"></label><label>E-Mail *<input type="email" name="email" autocomplete="email" required maxlength="254"></label><label>Unternehmen<input name="company" autocomplete="organization" maxlength="150"></label><label>Telefon<input type="tel" name="phone" autocomplete="tel" maxlength="50"></label></div><label>Deine Nachricht *<textarea name="message" rows="6" required maxlength="8000"></textarea></label><p class="form-note">* Pflichtfelder. Deine Angaben verwenden wir zur Bearbeitung deiner Anfrage. Mehr im <a href="datenschutz.html">Datenschutz</a>.</p><button class="button" type="submit">Nachricht senden <span aria-hidden="true">↗</span></button><p id="form-status" role="status" aria-live="polite"></p></form></section>
</main>
  <footer id="seitenfuss"></footer>
  <noscript><p class="no-script">Bitte aktiviere JavaScript für die Spieleübersicht. Unsere Spiele: <a href="speed-up.html">Speed Up</a>. SumSum folgt bald. Schreib uns an <a href="mailto:ahoi@spielhafen.ch">ahoi@spielhafen.ch</a>.</p></noscript>
</body>
</html>
